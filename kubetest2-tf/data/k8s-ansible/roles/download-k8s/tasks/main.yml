- name: Generate download URL based on S3 server.
  set_fact:
    src_template: >-
      {% if s3_server == 'dl.k8s.io' -%}
        https://{{ s3_server }}/{{ directory }}/{{ build_version }}
      {%- else -%}
        https://{{ s3_server }}/{{ bucket }}/{{ directory }}/{{ build_version }}
      {%- endif %}

- name: Download the k8s tarball to /tmp
  get_url:
    url: "{{ src_template }}/{{ item }}"
    dest: "/tmp/{{ item }}"
    mode: "0644"
    timeout: 120
  with_items: "{{ k8s_tar_bundles }}"
  register: k8s_dl
  until: k8s_dl is succeeded
  retries: 5
  delay: 15

- name: Capture filesystem state before extracting k8s bits
  shell: |
    set -o pipefail
    df -h /tmp /usr/local/bin
    ls -lh /tmp/{{ item }}
  args:
    executable: /bin/bash
  with_items: "{{ k8s_tar_bundles }}"
  changed_when: false

- name: Validate downloaded k8s tarball
  command: gzip -t /tmp/{{ item }}
  with_items: "{{ k8s_tar_bundles }}"
  register: k8s_tarball_validate
  until: k8s_tarball_validate is succeeded
  retries: 3
  delay: 10

- name: Extract the k8s bits
  shell: |
    set -o pipefail
    tar -xzf /tmp/{{ item }} -C /usr/local/bin/ --strip-components=3
  args:
    executable: /bin/bash
  with_items: "{{ k8s_tar_bundles }}"
  async: 1800
  poll: 15
  register: k8s_extract
  until: k8s_extract is succeeded
  retries: 3
  delay: 10

- name: Verify extracted Kubernetes binaries
  command: test -x /usr/local/bin/kubelet
  changed_when: false

- name: Remove the downloaded tarball
  file:
    path: "/tmp/{{ item }}"
    state: absent
  with_items: "{{ k8s_tar_bundles }}"

- name: Import control plane component container images
  shell: |
    export ARCH={{ ansible_architecture }}
    ctr -n k8s.io images import "/usr/local/bin/{{ item }}.tar"
    ctr -n k8s.io images ls -q | grep -e {{ item }} | xargs -L 1 -I '{}' /bin/bash -c 'ctr -n k8s.io images tag "{}" "$(echo "{}" | sed s/-'$ARCH':/:/)"'
  with_items:
    - kube-apiserver
    - kube-controller-manager
    - kubectl
    - kube-scheduler
  when: node_type == "master"

- name: Import common container images required for setting up cluster
  shell: |
    export ARCH={{ ansible_architecture }}
    ctr -n k8s.io images import "/usr/local/bin/{{ item }}.tar"
    ctr -n k8s.io images ls -q | grep -e {{ item }} | xargs -L 1 -I '{}' /bin/bash -c 'ctr -n k8s.io images tag "{}" "$(echo "{}" | sed s/-'$ARCH':/:/)"'
  with_items:
    - kube-proxy
